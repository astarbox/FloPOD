      tags:
      - Power Informations


  /setup/podBatPower:
    get:
      summary: Get the POD Battery power Informations
      description: 'Retrieve the POD Battery output power Informations.'
      operationId: getBatteryPower
      responses:
        '200':
          description: POD Battery power informations
          content:
            application/json:
