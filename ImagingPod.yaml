  /setup/podCalibrate:
    get:
      summary: Get the POD calibration status
      description: 'Retrieve the POD calibration status.'
      operationId: getCalibrationStatus
      responses:
        '200':
          description: Calibration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calibration'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Motion control
    put:
      summary: Start or stop calibration
      description: 'Start or stop the POD calibration.'
      operationId: setCalibrationStatus
      responses:
        '200':
          description: Calibration state successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Motion control
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/CalibrationAction'
              required:
              - value

  /setup/environmentData:
    get:
      summary: Get the POD environment sensor data
      description: 'Retrieve the POD environment sensor data.
        value.'
      operationId: getEnvironmentStatus
      responses:
        '200':
          description: POD environment sensor data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environmentData'

        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - General Informations

  /setup/shutterSpeed:
    get:
      summary: Get the POD Shutter speed
      description: 'Retrieve the POD Shutter speed in percent.'
      operationId: getShutterSpeed
      responses:
        '200':
          description: POD Shutter speed in step per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter settings
    put:
      summary: set the POD Shutter speed
      description: 'Set the POD Shutter speed in percent.'
      operationId: setShutterSpeed
      responses:
        '200':
          description: POD Shutter speed successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter settings
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/podOpen:
    put:
      summary: Open the POD Shutter
      description: 'This will open the POD Shutter'
      operationId: podOpen
      responses:
        '200':
          description: Opening the pod
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutterStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Control

  /setup/podClose:
