      description: 'Retrieve the POD USB-C output power Informations.'
      operationId: getUsbCPower
      responses:
        '200':
          description: POD USB-C power informations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortPowerData'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Power Informations

  /setup/podMainPower:
    get:
      summary: Get the POD main power informations
      description: 'Retrieve the POD main input power Informations.'
      operationId: getMainPower
      responses:
        '200':
          description: POD main power informations
          content:
            application/json:
