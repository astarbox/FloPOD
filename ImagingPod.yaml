      tags:
      - POD WiFi Hotspot
    put:
      summary: set the POD WiFi HotSpot Password
      description: 'Set the POD WiFi HotSpot Password.'
      operationId: setApWiFiPassword
      responses:
        '200':
          description: Hotspot Password successfully set.
        '400':
