openapi: 3.2.0

info:
  title: Pulsar Imaging POD API
  version: 1.0.0
  description: This API describes communications with the Pulsar Observatories Imaging POD REST server.
  contact:
    name: Pulsar Observatories
    url: https://www.pulsarastro.com/
servers:
- url: http://{host}/
  description: hostname or ip address of POD Controller
  variables:
    host:
      default: 172.16.42.100
      description: The hostname or ip address.
paths:
  /setup/useDHCP:
    get:
      summary: Get the POD DHCP setting
      description: 'Retrieve the POD DHCP setting.'
      operationId: getDHCPEnabled
      responses:
        '200':
          description: DHCP value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the POD DHCP setting
      description: 'Set the POD DHCP setting.'
      operationId: setDHCPEnabled
      responses:
        '200':
          description: DHCP successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: boolean
              required:
              - value

  /setup/ipAddress:
    get:
      summary: Get the POD IP Address
      description: 'Retrieve the POD IP Address.'
      operationId: getIpAddress
      responses:
        '200':
          description: IP Address value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the POD IP Address
      description: 'Set the POD IP Address.'
      operationId: setIpAddress
      responses:
        '200':
          description: IP Address successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/subnetMask:
    get:
      summary: Get the POD subnet mask
      description: 'Retrieve the POD subnet mask.'
      operationId: getSubnetMask
      responses:
        '200':
          description: Subnet mask value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the POD subnet mask
      description: 'Set the POD subnet mask.'
      operationId: setSubnetMask
      responses:
        '200':
          description: Subnet mask successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/ipGateway:
    get:
      summary: Get the POD gateway IP
      description: 'Retrieve the POD gateway IP.'
      operationId: getGatewayIP
      responses:
        '200':
          description: Gateway IP value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the POD gateway IP
      description: 'Set the POD gateway IP.'
      operationId: setGatewayIP
      responses:
        '200':
          description: Gateway IP successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/wifiClientSSID:
    get:
      summary: Get the WiFi client SSID
      description: 'Retrieve the WiFi SSID of the network the POD is connected to.'
      operationId: getWifiClientSSID
      responses:
        '200':
          description: POD client SSID
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - POD WiFi
    put:
      summary: set the POD WiFi HotSpot SSID
      description: 'Set the POD WiFi HotSpot SSID.'
      operationId: setWifiClientSSID
      responses:
        '200':
          description: Client SSID successfully set.
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - POD WiFi
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/wifiClientPassword:
    get:
      summary: Get the WiFi client password
      description: 'Retrieve the WiFi password of the network the POD will connected to.'
      operationId: getWifiClientPassword
      responses:
        '200':
          description: POD client SSID
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - POD WiFi
    put:
      summary: set the WiFi password of the network the POD will connected to
      description: 'Set the POD WiFi client password.'
      operationId: setWifiClientPassword
      responses:
        '200':
          description: Client SSID successfully set.
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - POD WiFi
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/wifiApSSID:
    get:
      summary: Get the POD WiFi HotSpot SSID
      description: 'Retrieve the POD WiFi HotSpot SSID.'
      operationId: getApWiFiSSID
      responses:
        '200':
          description: POD WiFi Hotspot SSID
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - POD WiFi Hotspot
    put:
      summary: set the POD WiFi HotSpot SSID
      description: 'Set the POD WiFi HotSpot SSID.'
      operationId: setApWiFiSSID
      responses:
        '200':
          description: Hotspot SSID successfully set.
        '400':
