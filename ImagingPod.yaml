components:
  schemas:
    ErrorCode:
      type: integer
      description: Error codes. Same as Alpaca
      enum:
      - 0
      - 1024
      - 1025
      - 1026
      - 1031
      - 1032
      - 1033
      - 1035
      - 1036

    CalibrationAction:
      type: string
      enum:
      - start
      - stop
      x-enum-varnames:
      - start
      - stop

    CalibrationStates:
      type: integer
      description: Calibration states
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      x-enum-varnames:
      - CAL_NONE
      - CAL_FIRST_CLOSE
      - CAL_OPENING
      - CAL_FINISH_CLOSE
      - CAL_DONE
      x-enum-descriptions:
      - POD is not calibration.
      - POD is doing first initial close.
      - POD is opening.
      - POD is doing 2nd close.
      - POD is done calibrating.

    ShutterStatus:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      x-enum-varnames:
      - OPEN
      - CLOSED
      - OPENING
      - CLOSING
      - ERROR
      x-enum-descriptions:
      - Shutter is open
      - Shutter is closed
      - Shutter is opening
      - Shutter is closing
      - Shutter state is unknown

    Response400ErrorInfo:
      type: object
      properties:
        ErrorNumber:
          $ref: '#/components/schemas/ErrorCode'
        ErrorMessage:
          type: string
      required:
      - ErrorNumber
      - ErrorMessage

    Calibration:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/CalibrationStates'
      required:
      - value

    PortPowerData:
      type: object
      properties:
        volts:
          type: number
          format: float
          description: port voltage
        amps:
          type: number
          format: float
          description: port amperage
        watt:
          type: number
          format: float
          description: port watt
      required:
      - volts
      - amps
      - watt

    environmentData:
      type: object
      properties:
        humidity:
          type: number
          format: float
          description: humidity
        temp:
          type: number
          format: float
          description: temperature
        raining:
          type: boolean
          description: raining yes/no
      required:
      - humidity
      - temp
      - raining

    PowerPortStatus:
      type: object
      properties:
        state:
          type: integer
          enum:
          - 0
          - 1
          x-enum-varnames:
          - OFF
          - ON
          x-enum-descriptions:
          - Off
          - On
      required:
      - state

    PowerPWMPortStatus:
      type: object
      properties:
        percent:
          type: integer
      required:
      - percent

  examples:
    ERROR_BUSY_MOVING:
      value:
        ErrorNumber: 1035
        ErrorMessage: POD is busy moving shutters.
      description: No Error
    ERROR_BUSY_CALIBRATING:
      value:
        ErrorNumber: 1035
        ErrorMessage: POD is busy calibrating.
      description: Controller is busy
    ERROR_READING_ENV:
      value:
        ErrorNumber: 1035
        ErrorMessage: POD can't read environment sensor.
      description: No Error

  responses:
    Response400:
      description: POD Controller error. Additional information encoded in the response
        content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response400ErrorInfo'
          examples:
            ERROR_BUSY_MOVING:
              $ref: '#/components/examples/ERROR_BUSY_MOVING'
            ERROR_BUSY_CALIBRATING:
              $ref: '#/components/examples/ERROR_BUSY_CALIBRATING'
            ERROR_READING_ENV:
              $ref: '#/components/examples/ERROR_READING_ENV'
